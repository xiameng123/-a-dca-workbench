<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1466ff">
<title>A指教财经资讯测试</title>
<style>
:root{--blue:#1466ff;--bg:#f3f7ff;--card:#fff;--ink:#15213d;--muted:#76839d;--line:#e6edf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:0 14px 42px}.hero{margin:0 -14px 18px;padding:calc(18px + env(safe-area-inset-top)) 18px 24px;background:linear-gradient(145deg,#1263f4,#64a0ff);color:white;border-radius:0 0 28px 28px}
h1{font-size:23px;margin:0}.sub{margin-top:8px;font-size:13px;line-height:1.6;opacity:.95}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.status{font-size:12px;color:var(--muted)}.refresh{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:9px 13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 22px rgba(40,80,160,.06)}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:8px}.tab{border:0;border-radius:999px;padding:10px 13px;background:#eaf2ff;color:#4874b4;font-weight:700;white-space:nowrap}.tab.active{background:var(--blue);color:white}
.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.title{display:block;color:var(--ink);text-decoration:none;font-size:14px;font-weight:750;line-height:1.5}.meta{font-size:11px;color:var(--muted);margin-top:6px}
.empty{padding:20px 4px;color:var(--muted);font-size:13px;line-height:1.7}.empty a{color:var(--blue)}
.note{margin-top:12px;font-size:11px;color:#7c88a0;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>A指教 · 财经资讯测试 v2</h1>
    <div class="sub">这版文件名固定为 <b>news-test.html</b>，避免 GitHub Pages 中文路径问题。资讯改用 JSONP 方式读取，专门兼容 Safari / GitHub Pages 静态网页。</div>
  </header>

  <div class="bar">
    <div id="status" class="status">准备加载…</div>
    <button class="refresh" onclick="reloadAll()">↻ 更新</button>
  </div>

  <section class="card">
    <div class="tabs">
      <button class="tab active" data-key="cn">中文财经</button>
      <button class="tab" data-key="yahoo">Yahoo 国际财经</button>
      <button class="tab" data-key="jin10">金十入口</button>
    </div>
    <div id="list"><div class="empty">正在加载…</div></div>
  </section>

  <div class="note">
    中文财经：Google News 财经 RSS 聚合；Yahoo：官方国际财经 RSS；金十：保留官方入口，不再用不稳定脚本抓取。若 RSS 转换服务临时不可用，会显示“直接打开来源”按钮，不会卡死。
  </div>
</div>

<script>
const data={cn:[],yahoo:[],jin10:[]};
let active='cn';
const feeds={
  cn:'https://news.google.com/rss/search?q=%E8%B4%A2%E7%BB%8F+OR+A%E8%82%A1+OR+ETF+OR+%E9%BB%84%E9%87%91&hl=zh-CN&gl=CN&ceid=CN:zh-Hans',
  yahoo:'https://tw.stock.yahoo.com/rss?category=intl-markets'
};
const direct={
  cn:'https://news.google.com/search?q=%E8%B4%A2%E7%BB%8F%20A%E8%82%A1%20ETF%20%E9%BB%84%E9%87%91&hl=zh-CN',
  yahoo:'https://tw.stock.yahoo.com/intl-markets/',
  jin10:'https://www.jin10.com/'
};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function timeFmt(v){if(!v)return '时间未知'; const d=new Date(v.replace(' ','T')); return isNaN(d)?v:d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function jsonpFeed(key){
  return new Promise((resolve)=>{
    const cb='cb_'+key+'_'+Date.now();
    const s=document.createElement('script');
    let done=false;
    const finish=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){};s.remove();resolve()};
    window[cb]=(j)=>{
      try{
        if(j && j.status==='ok'){
          data[key]=(j.items||[]).slice(0,12).map(it=>({
            title:it.title||'未命名资讯',
            url:it.link||direct[key],
            time:it.pubDate||'',
            source:key==='yahoo'?'Yahoo 股市':'中文财经'
          }));
        }
      }catch(e){}
      finish();
    };
    s.src='https://api.rss2json.com/v1/api.json?callback='+cb+'&rss_url='+encodeURIComponent(feeds[key])+'&_='+Date.now();
    s.onerror=finish;
    document.head.appendChild(s);
    setTimeout(finish,9000);
  });
}
function loadJin10(){
  data.jin10=[
    {title:'打开金十数据官方快讯',url:'https://www.jin10.com/',time:'',source:'金十数据'},
    {title:'打开金十快讯页',url:'https://flash.jin10.com/',time:'',source:'金十数据'}
  ];
}
function render(){
  const el=document.getElementById('list');
  const arr=data[active]||[];
  if(!arr.length){
    el.innerHTML=`<div class="empty">当前资讯源没有成功返回。<br><a href="${direct[active]}" target="_blank" rel="noopener">直接打开来源 →</a></div>`;
    return;
  }
  el.innerHTML=arr.map(x=>`<div class="item"><a class="title" target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.title)}</a><div class="meta">${esc(x.source)}${x.time?' · '+esc(timeFmt(x.time)):''}</div></div>`).join('');
}
async function reloadAll(){
  document.getElementById('status').textContent='正在获取真实资讯…';
  loadJin10();
  await Promise.allSettled([jsonpFeed('cn'),jsonpFeed('yahoo')]);
  const ok=['cn','yahoo','jin10'].filter(k=>data[k].length).length;
  document.getElementById('status').textContent=`已更新 ${ok}/3 个来源 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`;
  render();
}
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    active=btn.dataset.key;
    render();
  });
});
reloadAll();
</script>
</body>
</html>

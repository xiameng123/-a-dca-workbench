<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1466ff">
<title>纳斯达克综合指数 · 腾讯数据源测试</title>
<style>
:root{--blue:#1466ff;--bg:#f4f7ff;--card:#fff;--ink:#14213d;--muted:#77849b;--line:#e4ebf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.wrap{max-width:680px;margin:auto;padding:0 14px 36px}
.hero{margin:0 -14px 18px;padding:calc(20px + env(safe-area-inset-top)) 18px 24px;background:linear-gradient(145deg,#1466ff,#67a2ff);color:#fff;border-radius:0 0 28px 28px}
h1{font-size:22px;margin:0}.sub{font-size:12px;line-height:1.65;opacity:.95;margin-top:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(50,90,160,.06);margin-bottom:14px}
.label{font-size:12px;color:var(--muted)}.price{font-size:36px;font-weight:900;margin:6px 0 2px}.pct{font-size:18px;font-weight:800}.up{color:#e64f5a}.down{color:#2eaf6f}
.meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.k{font-size:12px;color:var(--muted)}.v{font-size:12px;font-weight:800;text-align:right}
.status{padding:11px 12px;border-radius:14px;background:#eef4ff;color:#3f67a4;font-size:12px;line-height:1.6}
.ok{background:#edf9f2;color:#277c51}.bad{background:#fff0f0;color:#a74747}
button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:800}
.actions{display:flex;justify-content:flex-end;margin:10px 0 14px}
canvas{width:100%;height:230px;display:block}.note{font-size:11px;color:#7e8ba1;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>纳斯达克综合指数 · 数据源测试</h1>
    <div class="sub">只测试腾讯行情是否能在 iPhone Safari / GitHub Pages 静态网页中稳定读取。成功后再并入正式工作台。</div>
  </header>

  <div class="actions"><button id="refresh">↻ 重新测试</button></div>

  <section class="card">
    <div class="label">实时行情 · 腾讯</div>
    <div id="price" class="price">--</div>
    <div id="pct" class="pct">--</div>
    <div id="quoteMeta" class="meta">正在获取…</div>
  </section>

  <section class="card">
    <div class="row"><div class="k">指数名称</div><div id="name" class="v">--</div></div>
    <div class="row"><div class="k">昨收</div><div id="prev" class="v">--</div></div>
    <div class="row"><div class="k">今开</div><div id="open" class="v">--</div></div>
    <div class="row"><div class="k">日高</div><div id="high" class="v">--</div></div>
    <div class="row"><div class="k">日低</div><div id="low" class="v">--</div></div>
    <div class="row"><div class="k">数据时间</div><div id="time" class="v">--</div></div>
  </section>

  <section class="card">
    <div class="label">历史 K 线测试</div>
    <div id="historyStatus" class="status">正在测试腾讯历史 K 线…</div>
    <canvas id="chart"></canvas>
    <div class="note">如果这里也能成功返回历史 K 线，后面就可以继续用于 5 年评分、RSI、均线、回撤和买卖点；如果只实时行情成功，我会再给历史评分单独配备用源。</div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);

function loadTencentQuote(){
  return new Promise(resolve=>{
    try{delete window.v_usIXIC}catch{}
    const old=document.getElementById('tx-quote'); if(old)old.remove();
    const s=document.createElement('script');
    s.id='tx-quote'; s.charset='gbk';
    s.src='https://qt.gtimg.cn/q=usIXIC&_='+Date.now();
    s.onload=()=>{
      try{
        const raw=window.v_usIXIC||'';
        if(!raw) throw new Error('腾讯实时接口没有返回 usIXIC');
        const f=raw.split('~');
        // 腾讯美股/指数常用字段：1 名称, 3 现价, 4 昨收, 5 今开, 30 时间, 31 涨跌额, 32 涨跌幅, 33 高, 34 低
        const q={
          name:f[1]||'纳斯达克综合指数',
          price:+f[3],
          prev:+f[4],
          open:+f[5],
          time:f[30]||'',
          change:+f[31],
          pct:+f[32],
          high:+f[33],
          low:+f[34]
        };
        renderQuote(q); resolve(true);
      }catch(e){
        $('#quoteMeta').textContent='实时行情失败：'+e.message; resolve(false);
      }
    };
    s.onerror=()=>{$('#quoteMeta').textContent='实时行情脚本加载失败';resolve(false)};
    document.head.appendChild(s);
    setTimeout(()=>resolve(false),8000);
  });
}

function renderQuote(q){
  $('#name').textContent=q.name;
  $('#price').textContent=Number.isFinite(q.price)?q.price.toFixed(2):'--';
  $('#prev').textContent=Number.isFinite(q.prev)?q.prev.toFixed(2):'--';
  $('#open').textContent=Number.isFinite(q.open)?q.open.toFixed(2):'--';
  $('#high').textContent=Number.isFinite(q.high)?q.high.toFixed(2):'--';
  $('#low').textContent=Number.isFinite(q.low)?q.low.toFixed(2):'--';
  $('#time').textContent=q.time||'--';
  const p=$('#pct'); p.textContent=Number.isFinite(q.pct)?`${q.pct>=0?'+':''}${q.pct.toFixed(2)}%`:'--';
  p.className='pct '+(q.pct>=0?'up':'down');
  $('#quoteMeta').textContent='腾讯实时行情已成功返回 · 页面 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 更新';
}

function loadTencentHistory(){
  return new Promise(resolve=>{
    const cb='tx_kline_'+Date.now();
    try{delete window[cb]}catch{}
    const s=document.createElement('script');
    const url='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var='+cb+'&param=usIXIC,day,,,260,qfq&_='+Date.now();
    s.src=url;
    s.onload=()=>{
      try{
        const j=window[cb];
        const d=j?.data?.usIXIC;
        const rows=d?.day||d?.qfqday||[];
        if(!rows.length) throw new Error('没有返回 usIXIC 日K');
        const parsed=rows.map(r=>({date:r[0],open:+r[1],close:+r[2],high:+r[3],low:+r[4]})).filter(x=>Number.isFinite(x.close));
        $('#historyStatus').className='status ok';
        $('#historyStatus').textContent=`历史 K 线成功：返回 ${parsed.length} 个交易日。`;
        draw(parsed);
        resolve(true);
      }catch(e){
        $('#historyStatus').className='status bad';
        $('#historyStatus').textContent='历史 K 线未成功：'+e.message;
        resolve(false);
      }finally{
        try{delete window[cb]}catch{}; s.remove();
      }
    };
    s.onerror=()=>{
      $('#historyStatus').className='status bad';
      $('#historyStatus').textContent='历史 K 线脚本加载失败。';
      resolve(false);
    };
    document.head.appendChild(s);
    setTimeout(()=>resolve(false),10000);
  });
}

function draw(rows){
  const c=$('#chart'),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1,w=rect.width,h=230;
  c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const vals=rows.map(x=>x.close),lo=Math.min(...vals),hi=Math.max(...vals),pad=16;
  const x=i=>pad+(w-pad*2)*i/(rows.length-1), y=v=>pad+(h-pad*2)*(1-(v-lo)/(hi-lo||1));
  ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e6edf7';ctx.lineWidth=1;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke()}
  ctx.beginPath();rows.forEach((r,i)=>i?ctx.lineTo(x(i),y(r.close)):ctx.moveTo(x(i),y(r.close)));
  ctx.strokeStyle='#1466ff';ctx.lineWidth=2;ctx.stroke();
}

async function run(){
  $('#quoteMeta').textContent='正在获取腾讯实时行情…';
  $('#historyStatus').className='status';$('#historyStatus').textContent='正在测试腾讯历史 K 线…';
  await Promise.allSettled([loadTencentQuote(),loadTencentHistory()]);
}
$('#refresh').onclick=run;
run();
</script>
</body>
</html>

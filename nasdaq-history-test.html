<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1466ff">
<title>纳指历史数据测试 · FRED</title>
<style>
:root{--blue:#1466ff;--bg:#f4f7ff;--card:#fff;--ink:#14213d;--muted:#77849b;--line:#e4ebf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.wrap{max-width:680px;margin:auto;padding:0 14px 36px}
.hero{margin:0 -14px 18px;padding:calc(20px + env(safe-area-inset-top)) 18px 24px;background:linear-gradient(145deg,#1466ff,#67a2ff);color:#fff;border-radius:0 0 28px 28px}
h1{font-size:22px;margin:0}.sub{font-size:12px;line-height:1.65;opacity:.95;margin-top:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(50,90,160,.06);margin-bottom:14px}
.status{padding:12px;border-radius:14px;background:#eef4ff;color:#3f67a4;font-size:12px;line-height:1.65}
.ok{background:#edf9f2;color:#277c51}.bad{background:#fff0f0;color:#a74747}
.big{font-size:34px;font-weight:900;margin:8px 0 4px}.meta{font-size:12px;color:var(--muted);line-height:1.6}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.k{font-size:12px;color:var(--muted)}.v{font-size:12px;font-weight:800;text-align:right}
button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:800}
.actions{display:flex;justify-content:flex-end;margin:10px 0 14px}
canvas{width:100%;height:240px;display:block}
.note{font-size:11px;color:#7e8ba1;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>纳指历史数据测试 · FRED</h1>
    <div class="sub">只测试 NASDAQ Composite 近 5 年日度收盘数据，成功后再和腾讯实时行情合并进正式工作台。</div>
  </header>

  <div class="actions"><button id="refresh">↻ 重新测试</button></div>

  <section class="card">
    <div id="status" class="status">正在读取 FRED 历史数据…</div>
    <div id="latest" class="big">--</div>
    <div id="latestMeta" class="meta">等待数据…</div>
  </section>

  <section class="card">
    <div class="row"><div class="k">返回交易日</div><div id="count" class="v">--</div></div>
    <div class="row"><div class="k">最早日期</div><div id="firstDate" class="v">--</div></div>
    <div class="row"><div class="k">最新日期</div><div id="lastDate" class="v">--</div></div>
    <div class="row"><div class="k">近5年最低</div><div id="low" class="v">--</div></div>
    <div class="row"><div class="k">近5年最高</div><div id="high" class="v">--</div></div>
  </section>

  <section class="card">
    <div class="meta">近 5 年收盘走势</div>
    <canvas id="chart"></canvas>
    <div class="note">这个数据源只有日度收盘价，没有开高低成交量。但你当前评分的价格分位、RSI、均线、阶段回撤和近20日位置都可以只用收盘价计算，因此只要这里能稳定返回，就够支持纳指评分。</div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);

function date5yAgo(){
  const d=new Date(); d.setFullYear(d.getFullYear()-5); d.setDate(d.getDate()-10);
  return d.toISOString().slice(0,10);
}
function today(){return new Date().toISOString().slice(0,10)}

async function loadFred(){
  const url=`https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQCOM&cosd=${date5yAgo()}&coed=${today()}&_=${Date.now()}`;
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(url,{cache:'no-store',signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text();
    const lines=txt.trim().split(/\r?\n/);
    if(lines.length<10) throw new Error('返回数据过少');
    const rows=[];
    for(let i=1;i<lines.length;i++){
      const [date,val]=lines[i].split(',');
      const close=Number(val);
      if(date && Number.isFinite(close)) rows.push({date,close});
    }
    if(rows.length<500) throw new Error('有效交易日不足 500 个');
    render(rows);
    $('#status').className='status ok';
    $('#status').textContent=`FRED 历史数据成功：返回 ${rows.length} 个有效交易日。`;
  }catch(e){
    $('#status').className='status bad';
    let msg=e?.name==='AbortError'?'请求超时':(e?.message||String(e));
    $('#status').textContent='FRED 历史数据失败：'+msg+'。如果这里失败，说明 Safari/GitHub Pages 对该接口仍有限制，我们再换第三个历史源。';
  }finally{
    clearTimeout(timer);
  }
}

function render(rows){
  const vals=rows.map(x=>x.close), last=rows.at(-1);
  $('#latest').textContent=last.close.toFixed(2);
  $('#latestMeta').textContent=`最新历史收盘 · ${last.date}`;
  $('#count').textContent=rows.length+' 个';
  $('#firstDate').textContent=rows[0].date;
  $('#lastDate').textContent=last.date;
  $('#low').textContent=Math.min(...vals).toFixed(2);
  $('#high').textContent=Math.max(...vals).toFixed(2);
  draw(rows);
}

function draw(rows){
  const c=$('#chart'),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1,w=rect.width,h=240;
  c.width=w*dpr;c.height=h*dpr;
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const vals=rows.map(x=>x.close),lo=Math.min(...vals),hi=Math.max(...vals),pad=16;
  const x=i=>pad+(w-pad*2)*i/(rows.length-1), y=v=>pad+(h-pad*2)*(1-(v-lo)/(hi-lo||1));
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#e6edf7';ctx.lineWidth=1;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke()}
  ctx.beginPath();
  rows.forEach((r,i)=>i?ctx.lineTo(x(i),y(r.close)):ctx.moveTo(x(i),y(r.close)));
  ctx.strokeStyle='#1466ff';ctx.lineWidth=2;ctx.stroke();
}

async function run(){
  $('#status').className='status';
  $('#status').textContent='正在读取 FRED 历史数据…';
  await loadFred();
}
$('#refresh').onclick=run;
run();
</script>
</body>
</html>
